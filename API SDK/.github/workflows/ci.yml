name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build SDK
        run: npm run build

      - name: Smoke test built package
        run: |
          node --input-type=module -e "import('./dist/esm/index.js').then(m => { console.log(Object.keys(m).slice(0, 12)); }).catch(err => { console.error(err); process.exit(1); })"
